name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

jobs:
  # ── PHP Syntax Check ─────────────────────────────────────────────
  php-syntax:
    name: PHP Syntax (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Check PHP syntax
        run: find . -name "*.php" -not -path "./.git/*" -not -path "./assets/*" -exec php -l {} \;

  # ── Release files: what the deploy workflow would ship ───────────
  # Builds the file set the same way as 10up/action-wordpress-plugin-deploy
  # (rsync with .distignore as the exclude list), fails if development or
  # tooling files are in it, and builds the release ZIP that the release
  # workflow attaches to the GitHub Release (same script, issue #71).
  # Needs no secrets and no SVN.
  release-files:
    name: Release files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and check the release file set and the ZIP
        run: bash .github/scripts/build-release.sh "${RUNNER_TEMP}/release"

      - name: Upload the release ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evangtermine-release-zip
          path: ${{ runner.temp }}/release/evangtermine-*.zip
          retention-days: 14
          if-no-files-found: error

  # ── Docs: markdownlint and relative links in README.md and docs/ (issue #29) ──
  # Configuration: .markdownlint-cli2.jsonc. The link check needs no network.
  docs:
    name: Docs (markdownlint, links)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: markdownlint
        run: npx --yes markdownlint-cli2@0.18.1

      - name: Relative links
        run: node .github/scripts/check-doc-links.mjs

  # ── PHPCS: PHP compatibility (blocking) and coding standards ─────
  phpcs:
    name: PHPCS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: Install dev dependencies
        run: composer install --no-interaction --no-progress

      # Blocking: the code must stay compatible with PHP 7.4 and newer.
      - name: PHP compatibility (PHPCompatibilityWP, PHP 7.4+)
        run: composer lint:compat

      # Not blocking until issue #13 (PHPCS violations) is done.
      - name: WordPress Coding Standards (phpcs.xml)
        continue-on-error: true
        run: composer lint:php

  # ── End-to-end tests: WordPress Playground + Playwright (issue #24) ──
  # The calendar host is mocked (tests/e2e/mock), so this job does not need www.evangelische-termine.de.
  e2e:
    name: E2E (PHP ${{ matrix.php }}, WP ${{ matrix.wp }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        wp: ['latest']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Install the browser for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run the E2E tests
        run: npm run test:e2e
        env:
          ET_E2E_PHP: ${{ matrix.php }}
          ET_E2E_WP: ${{ matrix.wp }}

      # Playground needs port 80 for a multisite (no custom ports); one PHP version is enough.
      - name: Run the multisite E2E test
        if: ${{ matrix.php == '8.3' }}
        run: |
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=80
          npm run test:e2e:multisite
        env:
          ET_E2E_PHP: ${{ matrix.php }}
          ET_E2E_WP: ${{ matrix.wp }}

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-php${{ matrix.php }}-wp${{ matrix.wp }}
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # ── AI config copies ─────────────────────────────────────────────
  ai-config-sync:
    name: AI config copies in sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: .github/agents and .github/instructions match .agents/
        run: bash .agents/scripts/sync-github-copies.sh --check
