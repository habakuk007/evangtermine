name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  # ── PHP Syntax Check ─────────────────────────────────────────────
  php-syntax:
    name: PHP Syntax (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Check PHP syntax
        run: find . -name "*.php" -not -path "./.git/*" -not -path "./assets/*" -exec php -l {} \;

  # ── PHPCS: PHP compatibility (blocking) and coding standards ─────
  phpcs:
    name: PHPCS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: Install dev dependencies
        run: composer install --no-interaction --no-progress

      # Blocking: the code must stay compatible with PHP 7.4 and newer.
      - name: PHP compatibility (PHPCompatibilityWP, PHP 7.4+)
        run: composer lint:compat

      # Not blocking until issue #13 (PHPCS violations) is done.
      - name: WordPress Coding Standards (phpcs.xml)
        continue-on-error: true
        run: composer lint:php
