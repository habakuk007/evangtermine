name: Bug report
description: Something does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report.
        **Security problem?** Do not use this form. Report it in private: https://github.com/habakuk007/evangtermine/security/advisories/new
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what you see, and what you expected to see instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the shortcode with its attributes, or the widget settings. Remove private data.
      placeholder: |
        1. Page with [et_veranstalter vid="952"]
        2. Click on ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      multiple: true
      options:
        - "[et_veranstalter]"
        - "[et_teaser]"
        - "[et_panels]"
        - "[et_minical]"
        - Widget
        - Settings page
        - Other
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: "3.4"
    validations:
      required: true
  - type: input
    id: wp-version
    attributes:
      label: WordPress version
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
    validations:
      required: true
  - type: input
    id: theme
    attributes:
      label: Theme
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Error messages
      description: Messages from the PHP error log or from the browser console, if there are any.
      render: text
    validations:
      required: false
